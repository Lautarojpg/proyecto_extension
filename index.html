<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Juego de Economía - Extensión</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="game-app" class="game-container">

    <div id="bg-layer" class="bg-illustration">
        <img src="public/image/limonada_portada.png" alt="Lemonade Stand">
    </div>

    <div id="toast-layer" class="toast-layer"></div>
    
    <!-- ==================== ESCENA 1: MENÚ PRINCIPAL ==================== -->
        <section id="scene-main-menu" class="scene active-scene">
            <div class="menu-content">
                <!-- Cartel de Título Estilo Madera -->
                <div class="title-board animate-bounce-soft">
                    <h1 class="game-title">Lemonade Stand</h1>
                </div>
                <!-- Botón Principal JUGAR -->
                <div class="menu-actions">
                    <button id="btn-start" class="btn-primary-large pulse-hover">
                        <span class="btn-icon">▶</span>
                        <span class="btn-text">¡INICIAR JUEGO!</span>
                    </button>
                    <!-- Botones Secundarios -->
                    <div class="menu-sub-actions">
                        <button id="btn-settings" class="btn-secondary">
                            <span class="btn-icon">⚙️</span>
                            <span>Ajustes</span>
                        </button>
                        <button id="btn-credits" class="btn-secondary">
                            <span class="btn-icon">📜</span>
                            <span>Créditos</span>
                        </button>
                        </button>
                    </div>
                </div>
            </div>
        </section>

    <!-- Marcadores Económicos -->
    <div id="stats-bar">
        <div class="stat">💰 <span id="stat-dinero">50</span></div>
        <div class="stat">⭐ <span id="stat-reputacion">50</span></div>
        <div class="stat">📦 <span id="stat-insumos">50</span></div>
    </div>

    <!-- Contenedor Principal de la Carta -->
    <div id="game-container">
        <div id="card" class="card">
            <div id="choice-overlay" class="choice-overlay"></div>
            <div id="card-image" class="card-image">🍋</div>
            <h2 id="card-title">Cargando...</h2>
            <p id="card-description">Cargando contenido...</p>
        </div>
    </div>
</div>
    

    <script src="app.js"></script>
</body>

</html>
