<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Juego de Economía - Extensión</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="game-app" class="game-container">

    <div id="bg-layer" class="bg-illustration">
        <img src="public/image/chipa_portada2.png" alt="Puesto de Chipa">
        <img id="cartel" src="public/image/cartel.png" class="objeto oculto">
        <img id="flyers" src="public/image/flyers.png" class="objeto oculto">
        <img id="hornito" src="public/image/hornito.png" class="objeto oculto">
        <img id="tomas" src="public/image/tomas.png" class="objeto oculto">
        <img id="puesto_city" src="public/image/puesto_city.png" class="objeto oculto">

    </div>

    <div id="toast-layer" class="toast-layer"></div>
    
    <!-- ==================== ESCENA 1: MENÚ PRINCIPAL ==================== -->
        <section id="scene-main-menu" class="scene active-scene">
            <div class="menu-content">
                <!-- Cartel de Título Estilo Madera -->
                <div class="title-board animate-bounce-soft">
                    <h1 class="game-title">Puesto de Chipa</h1>
                </div>
                <!-- Botón Principal JUGAR -->
                <div class="menu-actions">
                    <button id="btn-start" class="btn-primary-large pulse-hover">
                        <span class="btn-icon">▶</span>
                        <span class="btn-text">¡INICIAR JUEGO!</span>
                    </button>
                    <!-- Botones Secundarios -->
                    <div class="menu-sub-actions">
                        <button id="btn-settings" class="btn-secondary">
                            <span class="btn-icon">⚙️</span>
                            <span>Ajustes</span>
                        </button>
                        <button id="btn-credits" class="btn-secondary">
                            <span class="btn-icon">📜</span>
                            <span>Créditos</span>
                        </button>
                    </div>
                </div>
            </div>
        </section>

    <!-- Marcadores Económicos -->
    <div id="stats-bar">
        <div class="stat">💰 <span id="stat-dinero">50</span></div>
        <div class="stat">⭐ <span id="stat-reputacion">50</span></div>
        <div class="stat">📦 <span id="stat-insumos">50</span></div>
        <button id="btn-hud-settings" class="btn-hud-icon">⚙️</button>
    </div>

    <!-- Contenedor Principal de la Carta -->
    <div id="game-container">
        <div id="card" class="card">
            <div id="choice-overlay" class="choice-overlay"></div>
            <div id="card-image" class="card-image">🍋</div>
            <h2 id="card-title">Cargando...</h2>
            <p id="card-description">Cargando contenido...</p>
        </div>
    </div>
</div>

<!-- ============ MODAL DE AJUSTES ============ -->
<div id="modal-settings" class="modal-overlay hidden-modal">
    <div class="modal-card">
        <div class="modal-header">
            <h2>⚙️ Ajustes del Juego</h2>
            <button class="btn-close-modal" data-close="modal-settings">✖</button>
        </div>
        <div class="modal-body">
            <div class="setting-row">
                <span>🔊 Volumen de Sonido:</span>
                <div class="volume-control">
                    <input type="range" id="volume-slider" min="0" max="100" value="80" class="range-slider">
                    <span id="volume-value" class="volume-badge">80%</span>
                </div>
            </div>
            <div class="setting-row">
                <span>🖥️ Calibración de Pantalla:</span>
                <div class="calibrate-actions">
                    <button id="btn-toggle-fullscreen" class="btn-modal-action" title="Pantalla Completa">📺 Pantalla Completa</button>
                </div>
            </div>
            <div class="setting-row">
                <span>🔔 Efectos de Sonido (SFX):</span>
                <label class="switch">
                    <input type="checkbox" id="toggle-sfx" checked>
                    <span class="slider round"></span>
                </label>
            </div>
        </div>
        <div class="modal-footer">
            <button id="btn-restart-game" class="btn-modal-danger">🔄 Reiniciar Partida</button>
            <button class="btn-modal-confirm" data-close="modal-settings">Aceptar</button>
        </div>
    </div>
</div>
    

    <script src="app.js"></script>
    <script src="btn-ajuste.js"></script>
</body>

</html>
